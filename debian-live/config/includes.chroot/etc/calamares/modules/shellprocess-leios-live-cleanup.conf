# Removes what only the live system needs from the installed system, after
# the packages module has removed the live and installer packages. Runs in
# the installed system; a leading "-" ignores a failing command.
---
dontChroot: false
timeout: 30
script:
    # Installer configuration and launcher helpers (config/includes.chroot)
    - "-rm -rf /etc/calamares /usr/libexec/leios-live"
    - "-rm -f /etc/xdg/autostart/leios-installer-icon.desktop"
    # The installer's en_DE.UTF-8 entry (hook 9100-offer-en-de-locale-in-installer)
    - "-sed -i '/^en_DE\\.UTF-8 UTF-8$/d' /usr/share/i18n/SUPPORTED"
