# Prepares the EFI system partition for Debian's signed shim and GRUB, which
# LeiOS uses for Secure Boot (see the script). Runs in the installed system
# right after the bootloader module; does nothing on BIOS systems.
---
dontChroot: false
timeout: 60
script:
    - "/usr/libexec/leios-live/setup-efi-boot"
