# The "Dual Boot" page: whether the boot menu of the new installation also
# lists other operating systems on the computer, such as Windows (GRUB's
# os-prober). The choice is stored in GlobalStorage as
# packagechooser_leios-dualboot ("enabled" or "disabled"), and
# contextualprocess@leios-dualboot applies it. The pictures in the branding
# directory are screenshots of the LeiOS boot menu with and without Windows.
---
mode: required
method: legacy

labels:
    step: "Dual Boot"
    step[de]: "Dual Boot"

default: enabled

items:
    - id: enabled
      name: "Enable dual boot detection (recommended)"
      name[de]: "Dual-Boot-Erkennung aktivieren (empfohlen)"
      description: "The boot menu lists the other operating systems on this computer, such as Windows, next to LeiOS, so you can choose which one to start. LeiOS looks for them again whenever the boot menu is updated. Choose this if you keep Windows or another system on this computer, or if you are not sure."
      description[de]: "Das Startmenü zeigt neben LeiOS auch die anderen Betriebssysteme auf diesem Computer an, zum Beispiel Windows, damit Sie auswählen können, welches startet. LeiOS sucht bei jeder Aktualisierung des Startmenüs erneut danach. Wählen Sie diese Option, wenn Sie Windows oder ein anderes System auf diesem Computer behalten oder sich nicht sicher sind."
      screenshot: "dualboot-enabled.png"
    - id: disabled
      name: "Disable dual boot detection"
      name[de]: "Dual-Boot-Erkennung deaktivieren"
      description: "The boot menu only lists LeiOS and does not look at other disks and partitions. Other systems on this computer can still be started from the computer's own boot menu. Choose this if LeiOS is the only system on this computer."
      description[de]: "Das Startmenü zeigt nur LeiOS an und durchsucht keine anderen Datenträger und Partitionen. Andere Systeme auf diesem Computer lassen sich weiterhin über das Startmenü des Computers selbst starten. Wählen Sie diese Option, wenn LeiOS das einzige System auf diesem Computer ist."
      screenshot: "dualboot-disabled.png"
