# Applies the choice of the "Dual Boot" page (packagechooser@leios-dualboot)
# to the installed system (see the script). Runs in the installed system
# before GRUB is set up.
---
dontChroot: false
timeout: 30
packagechooser_leios-dualboot:
    enabled: "/usr/libexec/leios-live/setup-os-prober enabled"
    disabled: "/usr/libexec/leios-live/setup-os-prober disabled"
